spring.application.name=servicioenvios

server.port=8084

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/baseenvios}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

resilience4j.circuitbreaker.instances.servicioenvios.sliding-window-size=5
resilience4j.circuitbreaker.instances.servicioenvios.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.servicioenvios.wait-duration-in-open-state=10s

jwt.secret=c21hcnRsb2dpeGNhdHJpbmFmZXJuYW5kYWFuYWlzMTI=
jwt.expiration=86400000

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true